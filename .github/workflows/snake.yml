name: Snake Game - Eat My Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-snake-game:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Build neon snake game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?palette=github-dark&color_snake=#39ff14&color_dots=#020617,#052e16,#166534,#22c55e,#39ff14

      - name: Publish game
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
